[pytest]
# -rs PRINTS EVERY SKIP REASON. Without it CI shows only a count and an "s",
# so every carefully written skip message in this suite -- including
# test_sent_correspondence's deliberately loud "SKIPPED, NOT PASSED" -- is
# invisible exactly where it matters most. A skip nobody reads is the
# "could not check reads as clean" defect at the reporting layer.
# Added 2026-10-03 on a PR #146 review agent's recommendation.
addopts = -rs
testpaths = experiments/src
markers =
    slow: executes a real pipeline run rather than asserting on source or
        fixtures. Kept because a test that only greps source passes on code
        that names a key and never runs it, which is exactly how four protocol
        defects survived a passing smoke test in Sprint 8. Skip during rapid
        iteration with -m "not slow"; CI and pre-merge run everything.
