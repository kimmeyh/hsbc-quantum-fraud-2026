# Minimal CI (F16, card #52).
#
# WHY THIS EXISTS. Sprint 8 shipped a bug where RUNNING THE TEST SUITE
# overwrote experiments/results/ieee_classical.json -- the full 590,537-row,
# 3-fold run that every reported IEEE figure traces to -- with a 1-fold smoke
# result. It was caught from `git status` by luck, not by any check. The
# dirty-tree gate below is the tripwire for that class of defect: a test that
# modifies tracked files is a defect whether or not its assertions pass.
#
# Runs from a CLEAN CHECKOUT with no raw datasets, no rendered PDFs and no QCi
# credentials. Tests that need those SKIP rather than fail (they carry
# skipif guards), so a red build here always means a real regression.
name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r experiments/requirements.txt
          pip install ruff

      # Lint is advisory: a style warning must not block a submission fix five
      # days from the deadline. Failures are visible in the log and in the step
      # summary without failing the build.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check experiments/src scripts || true

      # `-m "not slow"` excludes the 89-second live-pipeline test, which is the
      # one test that deliberately runs a real fit. The full suite still runs
      # locally and pre-merge.
      - name: Tests
        run: pytest -m "not slow" -q

      # F78, Sprint 16. Until this step existed, every guard in this
      # repository was WINDOWS-ONLY protection: the hooks were PowerShell and
      # this runner is ubuntu-latest, so none of them had ever executed here.
      #
      # The suite above proves the hooks pass their tests. This proves one
      # actually FIRES on Linux, which is a different claim: a hook that loads
      # and returns 0 passes every test that only checks it does not crash.
      - name: A guard must FIRE on Linux, not merely load
        run: |
          set -e
          payload='{"tool_name":"Bash","tool_input":{"command":"git stash push -m x"}}'
          set +e
          echo "$payload" | python .claude/hooks/block_carry_forward_stash.py
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "::error::The carry-forward guard did not block on Linux."
            echo "::error::Expected exit 2, got $rc. A guard that does not fire"
            echo "::error::is indistinguishable from no guard at all."
            exit 1
          fi
          echo "Guard fired correctly on Linux (exit 2)."

          # And the other direction: a read must still be allowed, or the
          # guard blocks correct work and gets switched off.
          allowed='{"tool_name":"Bash","tool_input":{"command":"git stash list"}}'
          set +e
          echo "$allowed" | python .claude/hooks/block_carry_forward_stash.py
          rc2=$?
          set -e
          if [ "$rc2" -ne 0 ]; then
            echo "::error::The guard blocked a READ (git stash list) on Linux."
            echo "::error::Expected exit 0, got $rc2."
            exit 1
          fi
          echo "Read correctly allowed on Linux (exit 0)."

      # THE POINT OF THIS WORKFLOW. If the suite modified any tracked file, the
      # build fails and names the files. Sprint 8's evidence-overwrite bug
      # would have failed here on the PR that introduced it.
      - name: Test run must leave the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The test run modified tracked files. A test that"
            echo "::error::writes to the repository is a defect even when its"
            echo "::error::assertions pass -- Sprint 8 lost an evidence file"
            echo "::error::exactly this way. Files changed:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "Working tree clean after the test run."
